<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" style="background-color: #f8f9fc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="sidebarGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242533" />
      <stop offset="100%" stop-color="#181824" />
    </linearGradient>
    <linearGradient id="rightPanelHeaderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8f5" />
      <stop offset="100%" stop-color="#fef2ef" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000" flood-opacity="0.05"/>
    </filter>
    <filter id="rightSidebarShadow" x="-10%" y="0%" width="120%" height="100%">
      <feDropShadow dx="-4" dy="0" stdDeviation="15" flood-color="#000" flood-opacity="0.1"/>
    </filter>
    <!-- Geometric shapes for right panel header -->
    <clipPath id="circleClip">
      <circle cx="880" cy="50" r="30" />
    </clipPath>
  </defs>

  <!-- Left Sidebar -->
  <rect x="0" y="0" width="200" height="600" fill="url(#sidebarGradient)" />
  
  <!-- Logo Area -->
  <path d="M 25 35 L 30 25 L 35 35 L 30 45 Z" fill="#F97316" /> <!-- Orange diamond -->
  <text x="45" y="40" fill="#ffffff" font-size="16" font-weight="600">Guidance</text>
  
  <!-- User Dropdown Area -->
  <circle cx="30" cy="85" r="10" fill="#3B4155" />
  <text x="50" y="90" fill="#a0a4b8" font-size="13">demo_john</text>
  
  <!-- Nav Items -->
  <g fill="#a0a4b8" font-size="14">
    <!-- Content -->
    <rect x="25" y="115" width="12" height="12" rx="2" fill="none" stroke="#a0a4b8" stroke-width="1.5"/>
    <text x="50" y="125">Content</text>
    
    <!-- Widgets (Active) -->
    <rect x="10" y="140" width="180" height="36" rx="8" fill="#3B4155" />
    <rect x="25" y="152" width="12" height="10" rx="2" fill="none" stroke="#F97316" stroke-width="1.5"/>
    <text x="50" y="163" fill="#ffffff" font-weight="500">Widgets</text>
    
    <!-- Guidance Analytics -->
    <circle cx="31" cy="201" r="5" fill="none" stroke="#a0a4b8" stroke-width="1.5"/>
    <text x="50" y="205">Guidance analytics</text>
    
    <!-- Style -->
    <path d="M 27 245 L 35 235 L 35 245 Z" fill="none" stroke="#a0a4b8" stroke-width="1.5"/>
    <text x="50" y="245">Style</text>
    
    <!-- Tags -->
    <path d="M 25 285 L 35 275 L 35 285 Z" fill="none" stroke="#a0a4b8" stroke-width="1.5"/>
    <text x="50" y="285">Tags</text>
    
    <!-- Auto testing -->
    <path d="M 25 325 L 35 315 L 35 325 Z" fill="none" stroke="#a0a4b8" stroke-width="1.5"/>
    <text x="50" y="325">Auto testing</text>
    
    <!-- Settings -->
    <circle cx="31" cy="361" r="5" fill="none" stroke="#a0a4b8" stroke-width="1.5"/>
    <text x="50" y="365">Settings</text>
  </g>

  <!-- Bottom Nav -->
  <g fill="#a0a4b8" font-size="14">
    <!-- User Avatar -->
    <circle cx="30" cy="495" r="10" fill="#F97316" />
    <text x="26" y="500" fill="#ffffff" font-size="12" font-weight="bold">J</text>
    <text x="50" y="500">John</text>
    
    <!-- Notifications -->
    <path d="M 25 535 L 35 525 L 35 535 Z" fill="none" stroke="#a0a4b8" stroke-width="1.5"/>
    <text x="50" y="535">Notifications</text>
    
    <!-- Resources -->
    <path d="M 25 570 L 35 560 L 35 570 Z" fill="none" stroke="#a0a4b8" stroke-width="1.5"/>
    <text x="50" y="570">Resources</text>
  </g>

  <!-- Main Content Area -->
  <rect x="200" y="0" width="550" height="600" fill="#ffffff" />
  
  <!-- Header -->
  <text x="230" y="45" fill="#111827" font-size="24" font-weight="700">Widgets</text>
  
  <!-- Tabs -->
  <text x="230" y="90" fill="#3B82F6" font-size="14" font-weight="600">Draft</text>
  <rect x="230" y="100" width="35" height="3" fill="#3B82F6" rx="1.5" />
  
  <text x="290" y="90" fill="#6B7280" font-size="14">Ready</text>
  <text x="350" y="90" fill="#6B7280" font-size="14">Production</text>
  
  <!-- Create Folder & Search -->
  <rect x="620" y="70" width="100" height="32" rx="4" fill="none" stroke="#E5E7EB" stroke-width="1" />
  <text x="650" y="90" fill="#3B82F6" font-size="13" font-weight="500">Create folder</text>
  
  <rect x="730" y="70" width="100" height="32" rx="4" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1" />
  <text x="755" y="90" fill="#9CA3AF" font-size="13">Search</text>
  
  <!-- Table Header -->
  <rect x="230" y="115" width="500" height="40" fill="#F9FAFB" rx="4" />
  <rect x="245" y="128" width="14" height="14" rx="3" fill="#ffffff" stroke="#D1D5DB" stroke-width="1.5" />
  <text x="275" y="140" fill="#4B5563" font-size="12" font-weight="600">Name</text>
  <text x="510" y="140" fill="#4B5563" font-size="12" font-weight="600">Type</text>
  <text x="580" y="140" fill="#4B5563" font-size="12" font-weight="600">Version</text>
  <text x="640" y="140" fill="#4B5563" font-size="12" font-weight="600">Created on</text>
  
  <!-- Table Rows -->
  <g font-size="13" fill="#374151">
    <!-- Row 1 -->
    <rect x="230" y="160" width="500" height="40" fill="#ffffff" />
    <rect x="245" y="173" width="14" height="14" rx="3" fill="#ffffff" stroke="#D1D5DB" stroke-width="1.5" />
    <rect x="275" y="174" width="12" height="12" rx="2" fill="none" stroke="#9CA3AF" stroke-width="1.5"/>
    <text x="295" y="185">drag icon</text>
    <text x="510" y="185" fill="#6B7280">Smart Tip</text>
    <text x="580" y="185" fill="#6B7280">1</text>
    <text x="640" y="185" fill="#6B7280">Jun 07, 2024</text>
    <line x1="230" y1="200" x2="730" y2="200" stroke="#F3F4F6" stroke-width="1" />

    <!-- Row 2 -->
    <rect x="245" y="213" width="14" height="14" rx="3" fill="#ffffff" stroke="#D1D5DB" stroke-width="1.5" />
    <circle cx="281" cy="220" r="5" fill="none" stroke="#9CA3AF" stroke-width="1.5"/>
    <text x="295" y="225">pop up launcher</text>
    <text x="510" y="225" fill="#6B7280">Launcher</text>
    <text x="580" y="225" fill="#6B7280">1</text>
    <text x="640" y="225" fill="#6B7280">Jun 05, 2024</text>
    <line x1="230" y1="240" x2="730" y2="240" stroke="#F3F4F6" stroke-width="1" />

    <!-- Row 3 -->
    <rect x="245" y="253" width="14" height="14" rx="3" fill="#ffffff" stroke="#D1D5DB" stroke-width="1.5" />
    <circle cx="281" cy="260" r="5" fill="none" stroke="#9CA3AF" stroke-width="1.5"/>
    <text x="295" y="265">new launcher</text>
    <text x="510" y="265" fill="#6B7280">Launcher</text>
    <text x="580" y="265" fill="#6B7280">2</text>
    <text x="640" y="265" fill="#6B7280">May 27, 2024</text>
    <line x1="230" y1="280" x2="730" y2="280" stroke="#F3F4F6" stroke-width="1" />

    <!-- Row 4 -->
    <rect x="245" y="293" width="14" height="14" rx="3" fill="#ffffff" stroke="#D1D5DB" stroke-width="1.5" />
    <circle cx="281" cy="300" r="5" fill="none" stroke="#9CA3AF" stroke-width="1.5"/>
    <text x="295" y="305">Copy of Launcher Demo</text>
    <text x="510" y="305" fill="#6B7280">Launcher</text>
    <text x="580" y="305" fill="#6B7280">1</text>
    <text x="640" y="305" fill="#6B7280">May 13, 2024</text>
    <line x1="230" y1="320" x2="730" y2="320" stroke="#F3F4F6" stroke-width="1" />

    <!-- Row 5 -->
    <rect x="245" y="333" width="14" height="14" rx="3" fill="#ffffff" stroke="#D1D5DB" stroke-width="1.5" />
    <circle cx="281" cy="340" r="5" fill="none" stroke="#9CA3AF" stroke-width="1.5"/>
    <text x="295" y="345">Launcher Demo</text>
    <text x="510" y="345" fill="#6B7280">Launcher</text>
    <text x="580" y="345" fill="#6B7280">1</text>
    <text x="640" y="345" fill="#6B7280">May 03, 2024</text>
    <line x1="230" y1="360" x2="730" y2="360" stroke="#F3F4F6" stroke-width="1" />

    <!-- Row 6 -->
    <rect x="245" y="373" width="14" height="14" rx="3" fill="#ffffff" stroke="#D1D5DB" stroke-width="1.5" />
    <rect x="275" y="374" width="12" height="12" rx="2" fill="none" stroke="#9CA3AF" stroke-width="1.5"/>
    <text x="295" y="385">Salesforce ST</text>
    <text x="510" y="385" fill="#6B7280">Smart Tip</text>
    <text x="580" y="385" fill="#6B7280">1</text>
    <text x="640" y="385" fill="#6B7280">Apr 29, 2024</text>
    <line x1="230" y1="400" x2="730" y2="400" stroke="#F3F4F6" stroke-width="1" />
    
    <!-- Row 7 -->
    <rect x="245" y="413" width="14" height="14" rx="3" fill="#ffffff" stroke="#D1D5DB" stroke-width="1.5" />
    <circle cx="281" cy="420" r="5" fill="none" stroke="#9CA3AF" stroke-width="1.5"/>
    <text x="295" y="425">demo</text>
    <text x="510" y="425" fill="#6B7280">Launcher</text>
    <text x="580" y="425" fill="#6B7280">1</text>
    <text x="640" y="425" fill="#6B7280">Apr 27, 2024</text>
    <line x1="230" y1="440" x2="730" y2="440" stroke="#F3F4F6" stroke-width="1" />
  </g>

  <!-- Pagination -->
  <text x="230" y="570" fill="#9CA3AF" font-size="12">Rows 1-12 of 46</text>
  <g transform="translate(550, 555)">
    <rect x="0" y="0" width="24" height="24" fill="#ffffff" stroke="#E5E7EB" stroke-width="1" rx="2" />
    <text x="8" y="16" fill="#9CA3AF" font-size="12">&lt;</text>
    
    <rect x="28" y="0" width="24" height="24" fill="#3B82F6" rx="2" />
    <text x="36" y="16" fill="#ffffff" font-size="12">1</text>
    
    <rect x="56" y="0" width="24" height="24" fill="#ffffff" stroke="#E5E7EB" stroke-width="1" rx="2" />
    <text x="64" y="16" fill="#4B5563" font-size="12">2</text>
    
    <rect x="84" y="0" width="24" height="24" fill="#ffffff" stroke="#E5E7EB" stroke-width="1" rx="2" />
    <text x="92" y="16" fill="#4B5563" font-size="12">3</text>
    
    <rect x="112" y="0" width="24" height="24" fill="#ffffff" stroke="#E5E7EB" stroke-width="1" rx="2" />
    <text x="120" y="16" fill="#4B5563" font-size="12">4</text>
    
    <rect x="140" y="0" width="24" height="24" fill="#ffffff" stroke="#E5E7EB" stroke-width="1" rx="2" />
    <text x="148" y="16" fill="#4B5563" font-size="12">&gt;</text>
  </g>

  <!-- Dark narrow strip before right sidebar -->
  <rect x="750" y="0" width="30" height="600" fill="#1e1e2d" filter="url(#rightSidebarShadow)"/>
  <path d="M 760 25 L 765 15 L 770 25 Z" fill="#F97316" /> <!-- Orange diamond -->
  <rect x="760" y="45" width="10" height="10" fill="none" stroke="#a0a4b8" stroke-width="1.5" />
  
  <!-- Right Sidebar -->
  <rect x="780" y="0" width="220" height="600" fill="#ffffff" filter="url(#shadow)"/>
  
  <!-- Right Sidebar Header Area -->
  <rect x="780" y="0" width="220" height="110" fill="url(#rightPanelHeaderGradient)" />
  
  <!-- Abstract geometric shapes in top right -->
  <circle cx="950" cy="50" r="30" fill="#FCD34D" opacity="0.8" />
  <circle cx="910" cy="80" r="25" fill="#FCA5A5" opacity="0.8" />
  <polygon points="940,50 980,50 960,10" fill="#60A5FA" opacity="0.8" />
  <polygon points="900,90 940,90 920,130" fill="#78350F" opacity="0.9" />

  <!-- Header text -->
  <text x="800" y="40" fill="#EA580C" font-size="14" font-weight="700">Studio:</text>
  <text x="850" y="40" fill="#111827" font-size="14" font-weight="700">Guide. Track. Get</text>
  <text x="800" y="60" fill="#111827" font-size="14" font-weight="700">feedback. In context.</text>
  <text x="800" y="80" fill="#111827" font-size="14" font-weight="700">All in one place.</text>
  
  <!-- Right sidebar user profile -->
  <circle cx="810" cy="130" r="12" fill="#FCD34D" />
  <text x="830" y="135" fill="#4B5563" font-size="12" font-weight="500">demo_john</text>
  <text x="910" y="135" fill="#3B82F6" font-size="10" font-weight="600">Preview Mode</text>
  <line x1="780" y1="150" x2="1000" y2="150" stroke="#F3F4F6" stroke-width="1" />

  <!-- Content Section -->
  <text x="800" y="175" fill="#4B5563" font-size="10" font-weight="700" letter-spacing="1">CONTENT</text>
  
  <!-- Content Grid -->
  <g font-size="11" fill="#4B5563" text-anchor="middle">
    <rect x="800" y="190" width="80" height="70" rx="8" fill="#ffffff" stroke="#E5E7EB" stroke-width="1" />
    <circle cx="840" cy="215" r="5" fill="none" stroke="#9CA3AF" stroke-width="1.5" />
    <text x="840" y="245">Flow</text>

    <rect x="890" y="190" width="80" height="70" rx="8" fill="#ffffff" stroke="#E5E7EB" stroke-width="1" />
    <path d="M 925 210 Q 935 215 925 220" fill="none" stroke="#9CA3AF" stroke-width="1.5" />
    <text x="930" y="245">Link</text>

    <rect x="800" y="270" width="80" height="70" rx="8" fill="#ffffff" stroke="#E5E7EB" stroke-width="1" />
    <rect x="830" y="295" width="20" height="14" rx="2" fill="none" stroke="#9CA3AF" stroke-width="1.5" />
    <text x="840" y="325">Video</text>

    <rect x="890" y="270" width="80" height="70" rx="8" fill="#ffffff" stroke="#E5E7EB" stroke-width="1" />
    <rect x="920" y="295" width="20" height="14" rx="2" fill="none" stroke="#9CA3AF" stroke-width="1.5" />
    <text x="930" y="325">Article</text>
  </g>

  <!-- Widgets Section -->
  <text x="800" y="375" fill="#4B5563" font-size="10" font-weight="700" letter-spacing="1">WIDGETS</text>
  
  <!-- Widgets Grid -->
  <g font-size="11" fill="#4B5563" text-anchor="middle">
    <rect x="800" y="390" width="55" height="60" rx="8" fill="#ffffff" stroke="#E5E7EB" stroke-width="1" />
    <circle cx="827" cy="410" r="5" fill="none" stroke="#9CA3AF" stroke-width="1.5" />
    <text x="827" y="435">Beacon</text>

    <rect x="865" y="390" width="55" height="60" rx="8" fill="#ffffff" stroke="#E5E7EB" stroke-width="1" />
    <rect x="882" y="405" width="20" height="10" rx="2" fill="none" stroke="#9CA3AF" stroke-width="1.5" />
    <text x="892" y="435">Smart-tip</text>

    <rect x="930" y="390" width="55" height="60" rx="8" fill="#ffffff" stroke="#E5E7EB" stroke-width="1" />
    <rect x="947" y="405" width="20" height="14" rx="2" fill="none" stroke="#9CA3AF" stroke-width="1.5" />
    <text x="957" y="435">Popup</text>

    <rect x="800" y="460" width="55" height="60" rx="8" fill="#ffffff" stroke="#E5E7EB" stroke-width="1" />
    <circle cx="827" cy="480" r="5" fill="none" stroke="#9CA3AF" stroke-width="1.5" />
    <text x="827" y="505">Launcher</text>

    <rect x="865" y="460" width="55" height="60" rx="8" fill="#ffffff" stroke="#E5E7EB" stroke-width="1" />
    <rect x="882" y="475" width="20" height="14" rx="2" fill="none" stroke="#9CA3AF" stroke-width="1.5" />
    <text x="892" y="505">Survey</text>
  </g>

  <!-- Events Section -->
  <text x="800" y="555" fill="#4B5563" font-size="10" font-weight="700" letter-spacing="1">EVENTS</text>
</svg>
